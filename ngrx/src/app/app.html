

@let books = books$ | async;
@let bookCollection = bookCollection$ | async;

<h2>Available Books ({{ books?.length }})</h2>
<app-book-list class="book-list" [books]="books!" [collection]="bookCollection!" (add)="onAdd($event)"></app-book-list>


<h2>My Collection <span *ngIf="bookCollection?.length"> ({{bookCollection?.length }})</span></h2>
<app-book-collection class="book-collection" [books]="bookCollection!" (remove)="onRemove($event)">
</app-book-collection>

<router-outlet />
