<div
  *ngFor="let book of books(); index as index"
>
    <p>{{index + 1}}. {{book.volumeInfo.title}}</p>
    <div>
      <span> by {{book.volumeInfo.authors}}</span>
      <button
        (click)="add.emit(book.id)"
        data-test="add-button"
        [disabled]="isBookInCollection(book)"
      >Add to Collection</button>
    </div>
</div>
